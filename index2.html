<body>

<div class="container">

    <h1>N-Queens Problem</h1>

    <p class="subtitle">
        Solving N-Queens using Backtracking
    </p>


    <div class="card">

        <h2>Enter N</h2>

        <div class="input-area">

            <input
                type="number"
                id="nInput"
                value="4"
                min="1"
                max="10"
                placeholder="Enter N"
            >

            <button onclick="solve()">
                Solve
            </button>

        </div>

        <p id="error" class="error"></p>

    </div>


    <div class="card">

        <h2>Result</h2>

        <div class="stats">

            <div class="stat">
                <h3>N</h3>
                <p id="nResult">-</p>
            </div>

            <div class="stat">
                <h3>Solutions</h3>
                <p id="solutionCount">-</p>
            </div>

            <div class="stat">
                <h3>Backtracks</h3>
                <p id="backtrackCount">-</p>
            </div>

        </div>

    </div>


    <div class="card">

        <h2>Solutions</h2>

        <div id="solutions" class="solutions"></div>

    </div>


    <footer>

        <p>N-Queens using Backtracking</p>

        <p>Time Complexity: O(N!) | Space Complexity: O(N)</p>

    </footer>

</div>


<script>

function isSafe(board, row, col) {

    for (let prevRow = 0; prevRow < row; prevRow++) {

        const placed = board[prevRow];

        // Same column
        if (placed === col) {
            return false;
        }

        // Same diagonal
        if (
            Math.abs(prevRow - row) ===
            Math.abs(placed - col)
        ) {
            return false;
        }
    }

    return true;
}


function solveNQueens(n) {

    const board = Array(n).fill(-1);

    const solutions = [];

    let backtrackCount = 0;


    function backtrack(row) {

        if (row === n) {

            solutions.push([...board]);

            return;
        }


        for (let col = 0; col < n; col++) {

            if (isSafe(board, row, col)) {

                board[row] = col;

                backtrack(row + 1);

                board[row] = -1;

                backtrackCount++;
            }
        }
    }


    backtrack(0);

    return {
        solutions: solutions,
        backtracks: backtrackCount
    };
}


function createBoard(solution, n) {

    const board = document.createElement("div");

    board.className = "board";

    board.style.gridTemplateColumns =
        `repeat(${n}, 45px)`;


    for (let row = 0; row < n; row++) {

        for (let col = 0; col < n; col++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";


            if ((row + col) % 2 === 0) {

                cell.classList.add("white");

            } else {

                cell.classList.add("black");
            }


            if (solution[row] === col) {

                cell.textContent = "♛";
            }


            board.appendChild(cell);
        }
    }

    return board;
}


function solve() {

    const n =
        Number(document.getElementById("nInput").value);

    const error =
        document.getElementById("error");

    error.textContent = "";


    if (!Number.isInteger(n) || n < 1) {

        error.textContent =
            "Please enter a valid value of N.";

        return;
    }


    if (n > 10) {

        error.textContent =
            "Please enter N between 1 and 10.";

        return;
    }


    const result =
        solveNQueens(n);


    document.getElementById("nResult")
        .textContent = n;

    document.getElementById("solutionCount")
        .textContent = result.solutions.length;

    document.getElementById("backtrackCount")
        .textContent = result.backtracks;


    const container =
        document.getElementById("solutions");

    container.innerHTML = "";


    if (result.solutions.length === 0) {

        container.innerHTML =
            "<p>No solutions exist for this value of N.</p>";

        return;
    }


    result.solutions.forEach((solution, index) => {

        const card =
            document.createElement("div");

        card.className = "solution";


        const title =
            document.createElement("h3");

        title.textContent =
            `Solution ${index + 1}`;

        card.appendChild(title);


        const board =
            createBoard(solution, n);

        card.appendChild(board);


        const array =
            document.createElement("div");

        array.className = "array";

        array.textContent =
            "[" + solution.join(", ") + "]";

        card.appendChild(array);


        container.appendChild(card);
    });
}


solve();

</script>

</body>
</html>
